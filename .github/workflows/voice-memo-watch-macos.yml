name: voice-memo-watch (macOS)

# scripts/voice-memo-watch/ is written for macOS (BSD find/touch/date, the
# default /bin/bash) but developed and reviewed on Linux, where those tools
# behave differently or aren't available at all. This runs its self-test on
# a real macOS runner so a wrong flag is caught here instead of on someone's
# actual Mac. It stubs whisper/ffmpeg/claude — no real transcription, vault,
# or Claude Code login involved, so this only proves the mechanics (file
# detection, state tracking, error handling), not the real integration.

on:
  pull_request:
    paths:
      - 'scripts/voice-memo-watch/**'
      - '.github/workflows/voice-memo-watch-macos.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/voice-memo-watch/**'
      - '.github/workflows/voice-memo-watch-macos.yml'
  workflow_dispatch: {}

jobs:
  self-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this is really BSD userland, not GNU
        # `|| true` guards find/touch's own exit status directly, before any
        # piping — gating it on `head -1` instead (e.g. `cmd | head -1 ||
        # true`) would always look like success, since head is what exits 0.
        # An "illegal option" line below is expected and correct: it means
        # this really is BSD find/touch, not GNU.
        run: |
          { find --version || true; } 2>&1 | head -1
          { touch --version || true; } 2>&1 | head -1
          bash --version | head -1

      - name: Shell syntax check
        run: |
          bash -n scripts/voice-memo-watch/watch.sh
          bash -n scripts/voice-memo-watch/discover.sh
          bash -n scripts/voice-memo-watch/self-test.sh

      - name: Validate launchd plist
        run: plutil -lint scripts/voice-memo-watch/com.cricknote.voicememowatch.plist

      - name: Run self-test.sh
        run: bash scripts/voice-memo-watch/self-test.sh
